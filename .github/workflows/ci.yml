name: NanoGEMM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel pytest
        python -m pip install "numpy>=1.20.0, <2; implementation_name == 'pypy' and python_version < '3.10'" "numpy>=1.20.0, <2.3.0; implementation_name != 'pypy' and python_version <= '3.13'" "numpy>=1.20.0; implementation_name == 'pypy' and python_version >= '3.10'" "numpy>=2.3.0; implementation_name != 'pypy' and python_version >= '3.14'" "typing-extensions>=4.0; python_version < '3.10'"

    - name: Build C Extension
      run: |
        python setup.py build_ext --inplace || true

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        pytest -v tests/

    - name: Run Benchmarks
      env:
        PYTHONPATH: .
      run: |
        python benchmarks/bench_vs_numpy.py || true
